<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kali Linux Hub</title>
    <style>
        /* Base Cyberpunk Environment */
        body {
            background-color: #05070a;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            
            /* Animated Cyber Grid Background */
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: gridMove 20s linear infinite;
        }

        /* Scanline Overlay Screen Effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 1000px; }
        }

        /* Mobile Responsive Navigation Bar */
        .navbar {
            background: rgba(10, 14, 20, 0.95);
            border-bottom: 2px solid #00ff00;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0, 255, 0, 0.2);
        }

        .navbar-brand {
            color: #00ff00;
            font-weight: bold;
            font-size: 1.2rem;
            text-decoration: none;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.6);
        }

        .navbar-status {
            color: #ff3333;
            font-size: 0.85rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Main Page Layout Wrapper */
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Cyber HUD Container Boxes */
        .panel {
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(10, 14, 20, 0.9);
            border: 1px solid #1a5c1a;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.05),
                        inset 0 0 10px rgba(0, 255, 0, 0.05);
            text-align: center; /* Safe fallback centering */
        }

        /* Blinking Terminal Header Styling */
        h2, h3 {
            color: #00ff00;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(0, 255, 0, 0.6);
            margin-top: 0;
            font-size: 1.4rem;
        }

        h2::before { content: "[!] "; color: #ff3333; }
        h3::before { content: "root@kali:~# "; color: #33ffff; }

        /* Animated Typing Cursor */
        h3::after {
            content: "█";
            animation: blink 0.8s step-end infinite;
            margin-left: 5px;
        }

        @keyframes blink {
            from, to { color: transparent }
            50% { color: #00ff00; }
        }

        /* 100% Responsive Video Container Matrix */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Perfect 16:9 Aspect Ratio aspect spacing */
            height: 0;
            overflow: hidden;
            border: 3px solid #00ff00;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.25);
            border-radius: 4px;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0 !important;
        }

        /* Link Stack Configuration */
        .link-stack {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Interactive Terminal Hyperlinks */
        a.cyber-link {
            display: block;
            color: #33ffff;
            text-decoration: none;
            padding: 14px 18px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            background: rgba(0, 255, 255, 0.02);
            border-left: 4px solid #33ffff;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: bold;
            box-sizing: border-box;
            word-wrap: break-word; /* Prevents long text from overflowing screens */
        }

        /* Hover Interactive State */
        a.cyber-link:hover {
            color: #05070a;
            background-color: #33ffff;
            border-left-color: #ff3333;
            padding-left: 24px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        /* Mobile Accessibility Optimization Adjustments */
        @media (max-width: 600px) {
            body { padding: 0; }
            .container { padding: 15px; }
            .panel { padding: 15px; margin-bottom: 15px; }
            h2 { font-size: 1.1rem; }
            h3 { font-size: 1rem; }
            a.cyber-link { padding: 12px 15px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <!-- Sticky Mobile Navigation Bar -->
    <nav class="navbar">
        <a href="#" class="navbar-brand">KALI_NET_v1.0</a>
        <span class="navbar-status">[SECURE_SESSION]</span>
    </nav>

    <!-- Main Content Container -->
    <div class="container">

        <div class="panel">
            <h2>Watch a video for a reference</h2>
        </div>

        <div class="panel">
            <!-- Fluid Aspect Ratio Wrapper protects iframe layout from breaking -->
            <div class="video-wrapper">
                <iframe src="https://youtube.com" title="How to Dual Boot Kali Linux and Windows" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>

        <div class="panel">
            <h3>Click here for kali/linux related content</h3>
        </div>

        <div class="panel">
            <div class="link-stack">
                <a class="cyber-link" href="#">kali or linux basic commands</a>
                <a class="cyber-link" href="#">tools for ethical hacking</a>
                <a class="cyber-link" href="#">what is networking in kali linux</a>
            </div>
        </div>

    </div>

</body>
</html>
